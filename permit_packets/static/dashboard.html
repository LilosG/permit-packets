<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Permits · Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #f5f6f8; --panel: #ffffff; --ink: #0f172a; --ink-2: #334155; --muted: #64748b; --faint: #94a3b8;
  --line: #e6e8ec; --line-2: #eef0f3; --accent: #ea6a1f; --accent-soft: #fff1e8; --accent-ink: #b4490c;
  --radius: 12px; --shadow: 0 1px 2px rgba(15,23,42,.04), 0 1px 3px rgba(15,23,42,.06);
  --shadow-lg: 0 10px 30px rgba(15,23,42,.12), 0 2px 8px rgba(15,23,42,.06);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
button { font: inherit; cursor: pointer; }
a { color: inherit; }
.app { display: grid; grid-template-columns: 236px 1fr; min-height: 100vh; }

/* Sidebar */
.side { background: var(--panel); border-right: 1px solid var(--line); padding: 18px 14px; display: flex; flex-direction: column; gap: 22px; position: sticky; top: 0; height: 100vh; }
.org { display: flex; align-items: center; gap: 10px; padding: 4px 6px; }
.avatar { width: 34px; height: 34px; border-radius: 9px; background: linear-gradient(135deg, #f59e0b, var(--accent)); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 13px; letter-spacing: .02em; flex: none; }
.org b { display: block; font-size: 14px; line-height: 1.2; }
.org span { color: var(--muted); font-size: 12px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--ink-2); text-decoration: none; font-weight: 500; }
.nav a:hover { background: var(--bg); }
.nav a.on { background: var(--accent-soft); color: var(--accent-ink); }
.nav svg { width: 17px; height: 17px; flex: none; }
.nav .count { margin-left: auto; font-size: 12px; color: var(--muted); }
.side .foot { margin-top: auto; padding: 10px; border-radius: 10px; background: var(--bg); color: var(--muted); font-size: 12px; }

/* Main */
.main { padding: 22px 32px 48px; min-width: 0; }
.top { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
.top h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
.top .sub { color: var(--muted); font-size: 13px; }
.top .grow { flex: 1; }
.search { position: relative; width: 300px; }
.search input { width: 100%; height: 38px; padding: 0 12px 0 36px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); font: inherit; color: var(--ink); box-shadow: var(--shadow); }
.search input:focus { outline: none; border-color: #fdba8c; box-shadow: 0 0 0 3px rgba(234,106,31,.15); }
.search svg { position: absolute; left: 11px; top: 11px; width: 16px; height: 16px; color: var(--faint); }
.btn { height: 38px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font-weight: 600; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; box-shadow: var(--shadow); }
.btn:hover { background: #fafafa; }
.btn.primary { background: var(--ink); border-color: var(--ink); color: #fff; }
.btn.primary:hover { background: #1e293b; }
.btn svg { width: 16px; height: 16px; }

/* KPIs */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 18px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); }
.kpi .label { color: var(--muted); font-size: 12.5px; font-weight: 500; }
.kpi .value { font-size: 26px; font-weight: 700; letter-spacing: -.02em; margin-top: 4px; }
.kpi .delta { font-size: 12px; color: #15803d; margin-top: 2px; }
.kpi .delta.neutral { color: var(--muted); }

/* Card + tabs */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.tabs { display: flex; gap: 4px; padding: 10px 12px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { border: 0; background: none; padding: 7px 11px; border-radius: 8px; color: var(--muted); font-weight: 500; white-space: nowrap; display: inline-flex; gap: 7px; align-items: center; }
.tab:hover { background: var(--bg); color: var(--ink); }
.tab.on { background: var(--ink); color: #fff; }
.tab .n { font-size: 11.5px; padding: 1px 7px; border-radius: 99px; background: var(--line-2); color: var(--muted); }
.tab.on .n { background: rgba(255,255,255,.18); color: #fff; }

table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 10px 16px; background: #fafbfc; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 12px 16px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
tbody tr { cursor: pointer; transition: background .12s; }
tbody tr:hover { background: #fafbfc; }
tbody tr:last-child td { border-bottom: 0; }
.addr b { display: block; font-weight: 600; white-space: nowrap; }
.addr span { color: var(--muted); font-size: 12.5px; }
.type { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); font-weight: 500; white-space: nowrap; }
.type i { width: 8px; height: 8px; border-radius: 3px; display: inline-block; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; color: var(--ink-2); }
.dim { color: var(--faint); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 8px; border-radius: 99px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.s-draft { background: #f1f5f9; color: #475569; }
.s-review { background: #eef2ff; color: #4338ca; }
.s-submitted { background: #eff6ff; color: #1d4ed8; }
.s-corrections { background: #fef2f2; color: #b91c1c; }
.s-issued { background: #ecfdf5; color: #047857; }
.s-inspection { background: #fffbeb; color: #b45309; }
.s-closed { background: #f8fafc; color: #64748b; }
.empty { padding: 48px 16px; text-align: center; color: var(--muted); }
.rowact { color: var(--faint); }

/* Drawer */
.scrim { position: fixed; inset: 0; background: rgba(15,23,42,.28); opacity: 0; pointer-events: none; transition: opacity .2s; }
.scrim.open { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; top: 0; right: 0; height: 100vh; width: min(480px, 100vw); background: var(--panel); box-shadow: var(--shadow-lg); transform: translateX(100%); transition: transform .25s cubic-bezier(.2,.8,.2,1); display: flex; flex-direction: column; }
.drawer.open { transform: none; }
.dh { padding: 20px 22px 16px; border-bottom: 1px solid var(--line); }
.dh .row { display: flex; align-items: start; gap: 12px; }
.dh h2 { margin: 0; font-size: 18px; letter-spacing: -.01em; }
.dh p { margin: 2px 0 0; color: var(--muted); }
.x { margin-left: auto; border: 0; background: var(--bg); width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: var(--muted); }
.db { padding: 18px 22px; overflow: auto; flex: 1; display: flex; flex-direction: column; gap: 20px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 18px; }
.grid2 div span { display: block; color: var(--muted); font-size: 12px; }
.grid2 div b { font-weight: 600; }
.sec h3 { margin: 0 0 10px; font-size: 13px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.timeline { list-style: none; margin: 0; padding: 0; }
.timeline li { position: relative; padding: 0 0 16px 28px; }
.timeline li::before { content: ""; position: absolute; left: 7px; top: 18px; bottom: 0; width: 2px; background: var(--line); }
.timeline li:last-child::before { display: none; }
.dot { position: absolute; left: 0; top: 3px; width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); background: #fff; }
.timeline li.done .dot { border-color: #10b981; background: #10b981; box-shadow: inset 0 0 0 3px #fff; }
.timeline li.now .dot { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.timeline li.done::before { background: #a7f3d0; }
.timeline b { display: block; font-weight: 600; }
.timeline span { color: var(--muted); font-size: 12.5px; }
.timeline li.todo b { color: var(--faint); font-weight: 500; }
.doc { display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.doc .ic { width: 36px; height: 36px; border-radius: 8px; background: #fef2f2; color: #dc2626; display: grid; place-items: center; font-size: 11px; font-weight: 700; }
.doc b { display: block; font-weight: 600; }
.doc span { color: var(--muted); font-size: 12.5px; }
.doc .btn { margin-left: auto; height: 32px; box-shadow: none; }
.note { padding: 12px; background: var(--bg); border-radius: 10px; color: var(--ink-2); }
.note span { display: block; color: var(--muted); font-size: 12px; margin-bottom: 2px; }
.df { padding: 14px 22px; border-top: 1px solid var(--line); display: flex; gap: 10px; }
.df .btn.primary { margin-left: auto; }

.toast { position: fixed; bottom: 22px; left: 50%; transform: translate(-50%, 20px); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 10px; font-weight: 500; box-shadow: var(--shadow-lg); opacity: 0; transition: all .2s; pointer-events: none; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.demo-tag { font-size: 11px; font-weight: 600; color: var(--accent-ink); background: var(--accent-soft); padding: 2px 8px; border-radius: 99px; margin-left: 8px; vertical-align: middle; }

@media (max-width: 1100px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .col-permit, .col-updated { display: none; } }
@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; }
  .side { position: static; height: auto; flex-direction: row; align-items: center; padding: 12px 16px; border-right: 0; border-bottom: 1px solid var(--line); }
  .side .nav, .side .foot { display: none; }
  .main { padding: 18px 16px 40px; }
  .top { flex-wrap: wrap; } .search { width: 100%; order: 3; }
  .col-type, .col-city { display: none; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="org"><div class="avatar" id="org-initials">PP</div><div><b id="org-name">Your company</b><span>Permit packets</span></div></div>
    <nav class="nav">
      <a href="#" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Permits<span class="count" id="nav-count"></span></a>
      <a href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>New packet</a>
      <a href="#" data-soon><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Inspections</a>
      <a href="#" data-soon><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 21s-7-6.2-7-11a7 7 0 1 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>Cities</a>
      <a href="#" data-soon><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</a>
    </nav>
    <div class="foot">Demo data. Every packet is reviewed by your licensed electrician before it goes to the city.</div>
  </aside>

  <main class="main">
    <div class="top">
      <div><h1>Permits<span class="demo-tag">Demo</span></h1><div class="sub" id="sub"></div></div>
      <div class="grow"></div>
      <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="Search address, customer or permit #" aria-label="Search permits"></label>
      <a class="btn primary" href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>New packet</a>
    </div>

    <section class="kpis" id="kpis"></section>

    <section class="card">
      <div class="tabs" id="tabs" role="tablist"></div>
      <table>
        <thead><tr>
          <th>Job</th><th class="col-type">Type</th><th class="col-city">City</th><th class="col-permit">Permit #</th><th>Stage</th><th class="col-updated">Updated</th><th></th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty" id="empty" hidden>No permits match.</div>
    </section>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>
<div class="toast" id="toast"></div>

<script>
(() => {
  const params = new URLSearchParams(location.search);
  const company = params.get("company") || params.get("contractor") || "Your company";
  const cities = (params.get("cities") || "San Francisco,Daly City,San Mateo,South San Francisco,Millbrae")
    .split(",").map(s => s.trim()).filter(Boolean);
  document.getElementById("org-name").textContent = company;
  document.getElementById("org-initials").textContent =
    company.split(/\s+/).filter(w => /^[A-Za-z]/.test(w)).slice(0, 2).map(w => w[0].toUpperCase()).join("") || "PP";

  const STAGES = [
    ["draft", "Draft"], ["review", "Ready for review"], ["submitted", "Submitted"],
    ["issued", "Issued"], ["inspection", "Inspection scheduled"], ["closed", "Closed"],
  ];
  const LABEL = Object.fromEntries([...STAGES, ["corrections", "Corrections needed"]]);
  const TYPES = {
    ev: ["EV charger", "#ea6a1f"], service: ["Panel / service upgrade", "#2563eb"],
    subpanel: ["Subpanel / feeder", "#7c3aed"], circuit: ["240 V circuit", "#0d9488"],
  };
  const today = new Date();
  const day = n => { const d = new Date(today); d.setDate(d.getDate() - n); return d; };
  const fmt = d => d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  const ago = d => { const n = Math.round((today - d) / 864e5); return n === 0 ? "Today" : n === 1 ? "Yesterday" : `${n}d ago`; };
  const city = i => cities[i % cities.length];

  const seed = [
    ["1840 Alder St", "R. Nguyen", "ev", "inspection", 2, "48 A Tesla Wall Connector, garage"],
    ["227 Harbor View Dr", "K. Patel", "service", "submitted", 1, "100 A to 200 A service upgrade"],
    ["3315 Linden Ave", "M. Alvarez", "ev", "issued", 3, "40 A ChargePoint Home Flex, exterior wall"],
    ["91 Cypress Ct", "J. Okafor", "subpanel", "review", 0, "100 A subpanel, detached garage"],
    ["612 Marina Blvd", "S. Chen", "ev", "closed", 12, "48 A Tesla Wall Connector, garage"],
    ["4470 Ridge Rd", "D. Brooks", "circuit", "corrections", 1, "60 A hot tub circuit"],
    ["58 Sunset Way", "A. Romero", "ev", "draft", 0, "32 A Level 2, garage"],
    ["1209 Oak Hollow Ln", "T. Walsh", "service", "inspection", 4, "200 A panel replacement"],
    ["735 Pine Terrace", "L. Kim", "ev", "closed", 21, "48 A Tesla Wall Connector, carport"],
    ["2081 Bayside Ave", "P. Haddad", "circuit", "issued", 2, "Heat pump circuit, 40 A"],
    ["16 Willow Pl", "E. Fischer", "ev", "submitted", 1, "40 A Emporia, garage"],
    ["940 Crestline Dr", "G. Santos", "subpanel", "closed", 30, "125 A subpanel, ADU"],
    ["303 Laurel St", "N. Shah", "ev", "issued", 5, "48 A Tesla Wall Connector, garage"],
    ["77 Seacliff Ave", "C. Morgan", "service", "closed", 40, "Service upgrade with meter relocation"],
  ];
  let jobs = seed.map(([addr, cust, type, stage, upd, scope], i) => ({
    id: i + 1, addr, cust, type, stage, scope, city: city(i), updated: day(upd),
    created: day(upd + 3 + (i % 5)),
    permit: ["draft", "review"].includes(stage) ? "" : `E-2026-${String(48213 + i * 37).padStart(6, "0")}`,
  }));

  // Packets built in the builder on this browser, newest first.
  try {
    const typeKey = { "EV charger": "ev", "Panel / service upgrade": "service", "Subpanel / feeder": "subpanel", "240 V circuit": "circuit" };
    JSON.parse(localStorage.getItem("pp-demo-jobs") || "[]").forEach((b, i) => {
      jobs.unshift({
        id: 1000 + i, addr: b.addr, cust: b.cust, type: typeKey[b.typeLabel] || "ev", stage: b.stage,
        scope: "Built in the packet builder", city: b.city || city(i), updated: new Date(b.updated),
        created: new Date(b.updated), permit: "", fresh: true,
      });
    });
  } catch (e) { /* no saved jobs */ }

  let filter = "all";
  const $ = id => document.getElementById(id);

  function kpis() {
    const active = jobs.filter(j => !["closed"].includes(j.stage)).length;
    const insp = jobs.filter(j => j.stage === "inspection").length;
    const issued = jobs.filter(j => ["issued", "inspection", "closed"].includes(j.stage) && (today - j.updated) < 30 * 864e5).length;
    const fix = jobs.filter(j => j.stage === "corrections").length;
    $("kpis").innerHTML = [
      ["Active permits", active, (n => `${n} draft${n === 1 ? "" : "s"} in progress`)(jobs.filter(j => j.stage === "draft").length), "neutral"],
      ["Awaiting inspection", insp, "Scheduled this week", "neutral"],
      ["Issued, last 30 days", issued, "Packets built here", "neutral"],
      ["Needs attention", fix, fix ? "Corrections requested" : "All clear", fix ? "neutral" : ""],
    ].map(([l, v, d, c]) => `<div class="kpi"><div class="label">${l}</div><div class="value">${v}</div><div class="delta ${c}">${d}</div></div>`).join("");
    $("sub").textContent = `${company} · ${jobs.length} permits across ${new Set(jobs.map(j => j.city)).size} cities`;
    $("nav-count").textContent = active;
  }

  function tabs() {
    const order = ["all", "draft", "review", "submitted", "corrections", "issued", "inspection", "closed"];
    $("tabs").innerHTML = order.map(k => {
      const n = k === "all" ? jobs.length : jobs.filter(j => j.stage === k).length;
      const name = k === "all" ? "All" : LABEL[k];
      return `<button class="tab ${filter === k ? "on" : ""}" data-k="${k}" role="tab" aria-selected="${filter === k}">${name}<span class="n">${n}</span></button>`;
    }).join("");
  }

  function rows() {
    const q = $("q").value.trim().toLowerCase();
    const list = jobs
      .filter(j => filter === "all" || j.stage === filter)
      .filter(j => !q || [j.addr, j.cust, j.permit, j.city].join(" ").toLowerCase().includes(q))
      .sort((a, b) => (b.fresh ? 1 : 0) - (a.fresh ? 1 : 0) || b.updated - a.updated);
    $("empty").hidden = list.length > 0;
    $("rows").innerHTML = list.map(j => `
      <tr data-id="${j.id}">
        <td class="addr"><b>${j.addr}${j.fresh ? ' <span class="demo-tag" style="margin-left:6px">New</span>' : ""}</b><span>${j.cust}</span></td>
        <td class="col-type"><span class="type"><i style="background:${TYPES[j.type][1]}"></i>${TYPES[j.type][0]}</span></td>
        <td class="col-city">${j.city}</td>
        <td class="col-permit">${j.permit ? `<span class="mono">${j.permit}</span>` : `<span class="dim">—</span>`}</td>
        <td><span class="pill s-${j.stage}">${LABEL[j.stage]}</span></td>
        <td class="col-updated dim">${ago(j.updated)}</td>
        <td class="rowact">›</td>
      </tr>`).join("");
  }

  function render() { kpis(); tabs(); rows(); }

  function timeline(j) {
    const flow = STAGES.map(s => s[0]);
    const at = j.stage === "corrections" ? flow.indexOf("submitted") : flow.indexOf(j.stage);
    const steps = STAGES.map(([k, name], i) => {
      const state = i < at ? "done" : i === at ? (j.stage === "closed" ? "done" : "now") : "todo";
      const when = state === "todo" ? "" : fmt(day(Math.max(0, (at - i) * 2 + Math.round((today - j.updated) / 864e5))));
      return `<li class="${state}"><span class="dot"></span><b>${name}</b><span>${when}</span></li>`;
    });
    if (j.stage === "corrections") {
      steps.splice(at + 1, 0, `<li class="now"><span class="dot" style="border-color:#dc2626;box-shadow:0 0 0 4px #fef2f2"></span><b>Corrections needed</b><span>${fmt(j.updated)} · Reviewer asked for the panel schedule</span></li>`);
    }
    return steps.join("");
  }

  function next(j) {
    if (j.stage === "corrections") return "submitted";
    const flow = STAGES.map(s => s[0]);
    const i = flow.indexOf(j.stage);
    return i < flow.length - 1 ? flow[i + 1] : null;
  }

  function open(id) {
    const j = jobs.find(x => x.id === id);
    const nx = next(j);
    $("drawer").innerHTML = `
      <div class="dh"><div class="row"><div><h2>${j.addr}</h2><p>${j.city} · ${j.cust}</p></div><button class="x" data-close aria-label="Close">✕</button></div>
        <div style="margin-top:12px"><span class="pill s-${j.stage}">${LABEL[j.stage]}</span></div></div>
      <div class="db">
        <div class="grid2">
          <div><span>Job type</span><b>${TYPES[j.type][0]}</b></div>
          <div><span>Permit #</span><b class="${j.permit ? "mono" : "dim"}">${j.permit || "Not issued yet"}</b></div>
          <div><span>Scope</span><b>${j.scope}</b></div>
          <div><span>Created</span><b>${fmt(j.created)}</b></div>
        </div>
        <div class="sec"><h3>Progress</h3><ul class="timeline">${timeline(j)}</ul></div>
        <div class="sec"><h3>Documents</h3>
          <div class="doc"><div class="ic">PDF</div><div><b>Permit packet</b><span>7 pages · Built ${fmt(j.created)}</span></div><button class="btn" data-dl>Download</button></div>
        </div>
        <div class="sec"><h3>Notes</h3><div class="note"><span>Office · ${fmt(j.updated)}</span>Customer confirmed garage access for the inspection window.</div></div>
      </div>
      <div class="df">
        <button class="btn" data-dup>Duplicate job</button>
        ${nx ? `<button class="btn primary" data-next="${nx}">Move to ${LABEL[nx]}</button>` : `<button class="btn primary" disabled style="opacity:.5">Closed</button>`}
      </div>`;
    $("drawer").dataset.id = id;
    $("drawer").classList.add("open"); $("scrim").classList.add("open");
    $("drawer").setAttribute("aria-hidden", "false");
  }
  function close() { $("drawer").classList.remove("open"); $("scrim").classList.remove("open"); $("drawer").setAttribute("aria-hidden", "true"); }
  function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2200); }

  $("tabs").addEventListener("click", e => { const b = e.target.closest(".tab"); if (b) { filter = b.dataset.k; tabs(); rows(); } });
  $("q").addEventListener("input", rows);
  $("rows").addEventListener("click", e => { const tr = e.target.closest("tr"); if (tr) open(+tr.dataset.id); });
  $("scrim").addEventListener("click", close);
  document.addEventListener("keydown", e => { if (e.key === "Escape") close(); });
  document.querySelectorAll("[data-soon]").forEach(a => a.addEventListener("click", e => { e.preventDefault(); toast("Included in the full build"); }));
  $("drawer").addEventListener("click", e => {
    const j = jobs.find(x => x.id === +$("drawer").dataset.id);
    if (e.target.closest("[data-close]")) return close();
    if (e.target.closest("[data-dl]")) return toast("Packets download here in the full build");
    const nb = e.target.closest("[data-next]");
    if (nb) {
      j.stage = nb.dataset.next; j.updated = new Date();
      if (j.stage === "submitted" && !j.permit) j.permit = "";
      if (j.stage === "issued" && !j.permit) j.permit = `E-2026-${String(48213 + j.id * 41).padStart(6, "0")}`;
      render(); open(j.id); toast(`Moved to ${LABEL[j.stage]}`); return;
    }
    if (e.target.closest("[data-dup]")) {
      const copy = { ...j, id: Math.max(...jobs.map(x => x.id)) + 1, addr: `${j.addr} (copy)`, stage: "draft", permit: "", created: new Date(), updated: new Date() };
      jobs.push(copy); render(); open(copy.id); toast("Duplicated as a new draft");
    }
  });

  document.querySelectorAll('a[href="/"]').forEach(a => { a.href = "/" + location.search; });
  render();
})();
</script>
</body>
</html>
