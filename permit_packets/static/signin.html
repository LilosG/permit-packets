<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>EV Permit Packets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root { --ink: #15212c; --muted: #566572; --rule: #cfd7dd; --paper: #e6ebee; --sheet: #fbfcfc; --copper: #a8551f; --red: #b42318; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--paper); color: var(--ink); font: 16px/1.5 "IBM Plex Sans", system-ui, sans-serif; }
main { width: min(100%, 400px); border: 1.5px solid var(--ink); background: var(--sheet); }
.head { padding: 24px; border-bottom: 1.5px solid var(--ink); }
h1 { margin: 0; font: 700 34px/1.05 "Barlow Semi Condensed", Arial, sans-serif; }
.head p { margin: 8px 0 0; color: var(--muted); }
form { padding: 24px; }
label { display: block; font-size: 14px; font-weight: 500; }
input { display: block; width: 100%; margin-top: 6px; padding: 12px; border: 1px solid var(--ink); border-radius: 2px; background: #fff; color: var(--ink); font: inherit; }
button { width: 100%; margin-top: 16px; padding: 13px; border: 1px solid var(--ink); border-radius: 2px; background: var(--ink); color: #fff; font: 600 16px "IBM Plex Sans", system-ui, sans-serif; cursor: pointer; }
input:focus-visible, button:focus-visible { outline: 2px solid var(--copper); outline-offset: 2px; }
#error { min-height: 22px; margin: 10px 0 0; color: var(--red); font-size: 14px; }
</style>
</head>
<body>
<main>
  <div class="head"><h1>EV permit packets</h1><p>From job address to a permit packet ready for your review.</p></div>
  <form id="signin">
    <label>Password<input id="password" type="password" autocomplete="current-password" required autofocus></label>
    <button type="submit">Sign in</button>
    <p id="error" role="alert"></p>
  </form>
</main>
<script>
  document.querySelector('#signin').addEventListener('submit', async (event) => {
    event.preventDefault();
    const error = document.querySelector('#error');
    error.textContent = '';
    const response = await fetch('/api/signin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: document.querySelector('#password').value }),
    }).catch(() => null);
    if (response?.ok) { location.reload(); return; }
    error.textContent = response ? 'That password isn’t right.' : 'Sign-in didn’t go through. Try again.';
  });
</script>
</body>
</html>
